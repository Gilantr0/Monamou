<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camino de Paula</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: una columna tipo "camino" — fila de cinco piedras-letra arriba, la estación activa en una tarjeta, final con el acróstico completo */
:root{
  --bg:#fff0f5; --bg2:#ffd9e6; --ink:#5a1f3a; --muted:#9b5577;
  --pink:#ff5c93; --pink-deep:#d6336c; --card:#ffffff; --line:#f7b7cf;
  --display:"Caprasimo", "Georgia", serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; font-family:var(--body); color:var(--ink);
  background:radial-gradient(circle at 15% 10%, var(--bg2) 0, transparent 45%),
             radial-gradient(circle at 90% 85%, var(--bg2) 0, transparent 40%), var(--bg);
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:24px 48px;
}
.wrap{position:relative; z-index:1; max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:22px}

/* fondo: collage de polaroids teñido de rosa, con un velo encima para que se lea el texto */
.photos{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
.photos .grid{position:absolute; inset:-25%; display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:18px;
  transform:rotate(-8deg); filter:grayscale(1) sepia(1) hue-rotate(295deg) saturate(2.4) brightness(1.04)}
.pol{background:#fff; padding:6px 6px 22px; border-radius:4px; box-shadow:0 6px 14px -6px rgba(90,31,58,.5)}
.pol img{display:block; width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:2px}
.photos::after{content:""; position:absolute; inset:0; background:rgba(255,240,245,.62)}
header h1, header .sub, header .date{text-shadow:0 0 12px #fff, 0 0 4px #fff}
header{text-align:center; display:flex; flex-direction:column; gap:6px}
.date{font-size:.8rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); font-weight:800}
h1{font-family:var(--display); font-weight:400; font-size:clamp(2.2rem,9vw,3.4rem); line-height:1; margin:0; color:var(--pink-deep); text-wrap:balance}
.sub{margin:0; color:var(--muted)}

/* camino */
.path{position:relative; display:flex; justify-content:space-between; align-items:center; padding:8px 4px}
.path::before{content:""; position:absolute; left:28px; right:28px; top:50%; border-top:3px dashed var(--line); z-index:0}
.stone{position:relative; z-index:1; width:52px; height:52px; border-radius:50%;
  display:grid; place-items:center; font-family:var(--display); font-size:1.5rem;
  background:var(--card); color:var(--line); border:3px solid var(--line); transition:.35s}
.stone.now{border-color:var(--pink); color:var(--pink); transform:scale(1.12); box-shadow:0 0 0 6px rgba(255,92,147,.18)}
.stone.done{background:var(--pink); border-color:var(--pink); color:#fff}

.card{background:var(--card); border-radius:22px; padding:24px 20px; box-shadow:0 12px 30px -14px rgba(214,51,108,.45);
  display:flex; flex-direction:column; gap:14px; text-align:center; min-height:330px}
.step{font-size:.75rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:800}
.card h2{font-family:var(--display); font-weight:400; font-size:1.6rem; margin:0; color:var(--pink-deep); text-wrap:balance}
.card p{margin:0; line-height:1.5}
.zone{position:relative; flex:1; min-height:180px; border-radius:16px; background:var(--bg); overflow:hidden; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:12px; padding:14px}
button{font:inherit; cursor:pointer}
.btn{background:var(--pink); color:#fff; border:0; border-radius:999px; padding:12px 22px; font-weight:800; font-size:1rem}
.btn:hover{background:var(--pink-deep)}
button:focus-visible{outline:3px solid var(--pink-deep); outline-offset:3px}
.opt{background:var(--card); color:var(--ink); border:2px solid var(--line); border-radius:14px; padding:12px 14px; font-weight:600; width:100%}
.opt.bad{border-color:#e5a3b9; color:var(--muted); animation:shake .35s}
.opt.good{border-color:var(--pink); background:#ffe3ee; color:var(--pink-deep); font-weight:800}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bigheart{position:fixed; z-index:15; border:0; background:none; padding:0; line-height:0;
  animation:appear .35s ease-out, float 3.2s ease-in-out .35s infinite; filter:drop-shadow(0 10px 16px rgba(90,31,58,.35))}
.bigheart svg{width:100%; height:100%}
@keyframes float{50%{transform:translateY(-10px) rotate(-6deg)}}
@keyframes appear{from{transform:scale(0); opacity:0}}
.count{font-family:var(--display); font-size:2.6rem; color:var(--pink)}
.note{width:100%; margin:0; display:grid; place-items:center; text-align:center; min-height:2.6em;
  font-family:var(--display); font-size:2rem; line-height:1.2; color:var(--pink-deep); text-wrap:balance; animation:appear .4s ease-out}
.candle{border:0; background:none; display:flex; flex-direction:column; align-items:center; padding:4px}
.flame{width:14px; height:22px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; background:linear-gradient(#ffd166,#ff8a3d); animation:flick .4s infinite alternate}
.candle.off .flame{visibility:hidden}
.stick{width:14px; height:46px; border-radius:4px; background:repeating-linear-gradient(45deg,var(--pink) 0 8px,#ffc2d6 8px 16px)}
.timer{width:100%; text-align:center; font-family:var(--display); font-size:2.6rem; line-height:1.1; color:var(--pink-deep); font-variant-numeric:tabular-nums}
.timer.late{font-size:1.5rem; color:#e8590c}

/* fuego del juego de las velas */
canvas#fire{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0}
.scorch{position:fixed; inset:0; pointer-events:none; z-index:14; opacity:0;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(255,110,20,.25) 75%, rgba(200,40,0,.55) 100%);
  animation:glow .25s infinite alternate}
@keyframes glow{to{filter:brightness(1.25)}}
.card.onfire{box-shadow:0 0 0 3px #ff8a3d, 0 0 50px 10px rgba(255,90,0,.6); animation:tremble .12s infinite}
@keyframes tremble{25%{transform:translate(-1px,1px)}75%{transform:translate(1px,-1px)}}
@keyframes flick{to{transform:scale(1.1,.9)}}
.sling{display:block; width:100%; height:280px; touch-action:none; cursor:grab}
.sling:active{cursor:grabbing}
.note.small{font-size:1.25rem; min-height:1.6em}
/* último juego: las letras del título se vuelven tocables */
.hunt .word{white-space:nowrap}
.hunt .ltr{display:inline-block; cursor:pointer; transition:transform .15s, color .15s; animation:bob 2.4s ease-in-out infinite; animation-delay:calc(var(--i) * -.12s)}
.hunt .ltr:hover{color:var(--pink); transform:scale(1.18)}
.hunt .ltr.got{color:#fff; text-shadow:0 0 10px var(--pink), 0 0 4px var(--pink); animation:none; cursor:default}
@keyframes bob{50%{transform:translateY(-4px)}}
.answer{width:100%; display:flex; justify-content:center; gap:8px; min-height:52px}
.answer span{width:44px; height:48px; border-bottom:3px solid var(--line); font-family:var(--display); font-size:1.5rem; color:var(--pink-deep); display:grid; place-items:center}
.reveal{font-size:1.05rem; color:var(--pink-deep); font-weight:600}
.reveal b{font-family:var(--display); font-weight:400; font-size:1.5rem}

/* acróstico armado */
.poem{display:flex; flex-direction:column; gap:10px; text-align:left}
.line{display:flex; gap:12px; align-items:baseline; opacity:.25; transition:opacity .5s}
.line.on{opacity:1}
.line b{font-family:var(--display); font-weight:400; font-size:2rem; color:var(--pink); width:30px; flex:none; text-align:center}
.line span{line-height:1.45; min-width:0}
.final h2{font-size:2rem}
.sign{text-align:right; font-family:var(--display); color:var(--pink-deep); font-size:1.2rem}
canvas#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:20}
.mute{position:fixed; top:max(12px, env(safe-area-inset-top,0px)); right:max(12px, env(safe-area-inset-right,0px)); z-index:30;
  width:44px; height:44px; border-radius:50%; border:2px solid var(--line); background:var(--card); font-size:1.2rem; line-height:1;
  box-shadow:0 6px 14px -6px rgba(214,51,108,.5)}
</style>
</head>
<body>

<canvas id="fx"></canvas>
<button class="mute" id="mute" aria-label="Silenciar sonidos">🔊</button>
<div class="photos" aria-hidden="true"><div class="grid" id="grid"></div></div>
<canvas id="fire" aria-hidden="true"></canvas>
<div class="scorch" id="scorch" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <span class="date">30 · 10 · 2026</span>
    <h1>Feliz cumpleaños, Mon Amour</h1>
    <p class="sub">¿Por qué nos limitamos a simples mensajes? Cuando hay miles de posibilidades para demostrarnos nuestro amor.</p>
  </header>

  <div class="path" id="path" aria-label="Progreso del camino"></div>

  <section class="card" id="card" aria-live="polite"></section>
</div>

<script>
const NAME = ["P","A","U","L","A"];
const LINES = [
  "Por cada uno de los días que he podido compartir a tu lado, por todas esas tardes, noches y mañanas que hemos compartido juntos, por todas esas salidas inesperadas y aunque por más planeadas que fueran nunca terminaban como esperábamos, por cada uno de los restaurantes a los que nos fuimos de gorditos a comer así sea un heladito, por todos esos días que espero nunca tengan un fin.",
  "Amo el poder tener a alguien tan única e inigualable persona en mi vida, amo poder decir que eres la única persona con la que realmente quiero estar para el resto de la eternidad, amo poder imaginarte como lo que alguna vez soñé tener en mi vida, amo que la reciprocidad y el cariño mutuo que nos tenemos nos permita seguir luchando por esta relación todos los días,",
  "Una persona tan inteligente, tan responsable, tan increíblemente maravillosa, una persona a la que le confiaría toda mi vida, porque si sé de alguien que a pesar de las adversidades, sabe perfectamente sobrellevar todas las situaciones negativas en su vida, eres tú, una mujer, una chica, una amiga, una novia, una confidente, una amante, una persona con la que no existe el más mínimo ápice de duda que amo con toda el alma,",
  "Llenas mi vida de mucho aprendizaje, me llenas de lecciones, me llenas de motivaciones, me llenas de mucha comidita y postrecitos ricos ricos, me llenas de besos, de amor, de cariños, de abrazos, de risas, de muchas risas me llenas el alma, me llenas de tiktoks que en su mayoría la verdad son malos, pero el simple hecho de que tú pienses en mostrarme cosas que tú consideras graciosas o que me harán reír, es todo lo que necesito saber para ver cómo de grande es tu amor,",
  "Ahora solo espero que hayas disfrutado de este pequeño detallito que prepare para ti, anhelo que asi como estas te puedo seguir dando miles de sorpresas sorpresivas en el futuro y de verdad nunca cansarme de sorprenderte con este tipo de cosas, espero así mismo que recuerdes mi incandescente amor por ti, te deseo un muy Feliz cumpleaños mi corazon, te amo 🧡🧡🧡"
];
/* ✏️ Comentarios de los 22 corazones: el 1 sale al reventar el primero, el 22 al reventar el último */
const NOTAS = [
  "Mi Corazón de Melón",
  "Mi Chuchurru",
  "Mi Amorcete",
  "Mi Bebita Fiu Fiu",
  "Mi Pidaña",
  "Mi Marranita",
  "Mi Princesa",
  "Mi Cielito",
  "Mi Chocorramito",
  "Mi Bombón",
  "Mi Arroz Paisa",
  "Mi Reina",
  "Mi Preciosura",
  "Mi Cachetona",
  "Mi Caramelo",
  "Mi Aguita Fría",
  "Mi Limonada De Coco",
  "Mi Lichi",
  "Mi Chocolatico",
  "Mi Sensibilirad",
  "Mi Fresita",
  "Mi Todo"
];
const HEART_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 4 6.3 4c2.3 0 3.8 1.3 5.7 3.4C13.9 5.3 15.4 4 17.7 4c4 0 5.9 4.4 4.3 7.7C19.5 16.4 12 21 12 21z"/><ellipse cx="7.5" cy="8.5" rx="2" ry="1.3" fill="#fff" opacity=".45" transform="rotate(-30 7.5 8.5)"/></svg>';
const FOTOS =Array.from({length:15},(_,i)=>`fondo/foto${String(i+1).padStart(2,"0")}.jpg`);
let stage = 0;

/* fondo: llena la pantalla de polaroids en orden aleatorio, cada una un poquito chueca */
{
  const grid=document.getElementById("grid");
  const big=Math.max(screen.width,screen.height,innerWidth,innerHeight)*1.6;
  const n=Math.ceil(big/148)*Math.ceil(big/200);
  const mix=[...FOTOS].sort(()=>Math.random()-.5);
  for(let k=0;k<n;k++){
    const p=document.createElement("div"); p.className="pol";
    p.style.transform=`rotate(${(Math.random()*10-5).toFixed(1)}deg)`;
    p.innerHTML=`<img src="${mix[k%mix.length]}" alt="">`;
    grid.appendChild(p);
  }
}
const card = document.getElementById("card");
const pathEl = document.getElementById("path");

NAME.forEach(l=>{
  const s=document.createElement("div"); s.className="stone"; s.textContent=l; pathEl.appendChild(s);
});
function paint(){
  [...pathEl.children].forEach((s,i)=>{s.className="stone"+(i<stage?" done":i===stage?" now":"")});
}

function win(){
  undoTitle?.(); // si venía del último juego, el título vuelve a ser normal
  burst(60); sfx.win();
  const i=stage;
  card.innerHTML=`<div class="step">Parada ${i+1} de 5</div>
    <h2>¡Obtuviste la letra ${NAME[i]}!</h2>
    <p class="reveal"><b>${NAME[i]}</b> — ${LINES[i]}</p>
    <div style="flex:1"></div>
    <div><button class="btn" id="next">${i<4?"Seguir el camino":"Ver tu sorpresa"}</button></div>`;
  stage++; paint();
  document.getElementById("next").onclick = ()=>{ sfx.tick(); (stage<5 ? games[stage] : finale)(); };
}
function shell(title,text){
  card.innerHTML=`<div class="step">Parada ${stage+1} de 5</div><h2>${title}</h2><p>${text}</p><div class="zone" id="zone"></div>`;
  return document.getElementById("zone");
}

/* 1 · 22 corazones, uno por cada año: salen de uno en uno por toda la pantalla, cada vez más grandes y de otro color */
function g1(){
  const z=shell("¿A que no adivinas cuántos corazones hay en esta sección?","Trata de reventar todos los corazones y verás diferentes maneras en las que me podría dirigir a ti.");
  z.style.flexDirection="column";
  z.innerHTML='<div class="count" id="count">0 / 22</div><p class="note" id="note">¿Lograrás encontrar cada uno?</p>';
  let k=0;
  const next=()=>{
    const s=Math.min(36+k*10, innerHeight*.6), h=document.createElement("button");
    /* busca un lugar que no tape la tarjeta (donde sale el comentario); si no cabe en 40 intentos, se queda con el último */
    const c=card.getBoundingClientRect(); let x, y;
    for(let t=0;t<40;t++){
      x=16+Math.random()*(innerWidth-s-32); y=16+Math.random()*(innerHeight-s-32);
      if(x+s<c.left-10 || x>c.right+10 || y+s<c.top-10 || y>c.bottom+10) break;
    }
    h.className="bigheart"; h.setAttribute("aria-label",`Corazón ${k+1} de 22`); h.innerHTML=HEART_SVG;
    h.style.cssText=`width:${s}px; height:${s}px; color:hsl(${(340+k*137.5)%360} 85% 62%); left:${x}px; top:${y}px`;
    h.onclick=()=>{
      const r=h.getBoundingClientRect(); h.remove();
      burst(12+k*2, r.left+r.width/2, r.top+r.height/2); sfx.heart(k);
      document.getElementById("count").textContent=`${k+1} / 22`;
      const n=document.getElementById("note"); n.textContent=NOTAS[k]; n.style.animation="none"; void n.offsetWidth; n.style.animation="";
      if(++k===22) setTimeout(win,2000); else setTimeout(next,400);
    };
    document.body.appendChild(h);
  };
  next();
}
/* 2 · tres preguntas seguidas: [título, pregunta, nota, opciones [texto, correcta]] */
const PREGUNTAS = [
  ["Pregunta difícil", "¿Cuál es la diferencia de días entre mi día de cumpleaños y el tuyo?", "(No tienes permitido buscar en Google)",
    [["65",0],["66",1],["67",0]]],
  ["Pregunta normal", "¿Cómo se llamaría alguno de nuestros animales en el futuro?", "",
    [["Aureliano / Génesis",1],["Ariel / Ricardo",0],["Firulais / Perro Watón",0]]],
  ["Pregunta fácil", "¿Cuánto crees que te amo?", "",
    [["Un 100%",0],["1.000.000 sobre 100",0],["La cantidad de decimales de pi",1]]]
];
function g2(q=0){
  const [title,text,hint,opts]=PREGUNTAS[q];
  const z=shell(`${title} · ${q+1} de 3`, text+(hint?`<br><small>${hint}</small>`:""));
  z.style.flexDirection="column";
  opts.forEach(([t,ok])=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=t;
    b.onclick=()=>{
      if(ok){
        if(z.dataset.done) return; z.dataset.done=1;
        b.classList.add("good"); b.textContent="✓ "+t;
        if(q===2) setTimeout(win,500); else { sfx.right(); burst(25); setTimeout(()=>g2(q+1),900); }
      } else { sfx.bad(); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); b.textContent="Incorrecto 🫩"; }
    };
    z.appendChild(b);
  });
}
/* 3 · 22 velitas en 10 segundos: el fuego crece con el tiempo y, si se acaba, la página arde hasta que apague la última */
function g3(){
  const z=shell("Apaga las 22 velitas","Solo tienes 10 segundos para apagar todas las velas o la página se va a prender en llamas, ¡apúraleeeeeee!");
  z.style.gap="8px 6px";
  z.innerHTML='<div class="timer" id="timer">10.0</div>';
  const timer=document.getElementById("timer"), t0=performance.now();
  let left=22;
  for(let k=0;k<22;k++){
    const c=document.createElement("button"); c.className="candle"; c.setAttribute("aria-label","Vela encendida");
    c.innerHTML='<div class="flame"></div><div class="stick"></div>';
    c.onclick=()=>{
      if(c.classList.contains("off"))return;
      const r=c.getBoundingClientRect(); c.classList.add("off"); c.setAttribute("aria-label","Vela apagada");
      burst(6, r.left+r.width/2, r.top); sfx.blow();
      if(--left===0){ stop(); timer.classList.remove("late"); timer.textContent="¡Uff, apagaste el incendio! 🧯"; setTimeout(win,1200) }
    };
    z.appendChild(c);
  }
  const clock=setInterval(()=>{
    const s=(performance.now()-t0)/1000;
    setHeat(Math.min(1,(s/10)**1.4));
    if(s<10) timer.textContent=(10-s).toFixed(1);
    else if(!card.classList.contains("onfire")){ card.classList.add("onfire"); timer.classList.add("late"); timer.textContent="🔥 ¡Se está quemando todo! ¡Sigue soplando! 🔥" }
    if(Math.random()<heat*.6) sfx.crackle();
  },100);
  function stop(){ clearInterval(clock); card.classList.remove("onfire"); setHeat(0) }
}
/* 4 · catapulta: estira hacia atrás, apunta y suelta para que Paula caiga en los brazos de Felipe */
const FALLA_CORTA = ["Dale un poquito mas fuerte", "Ya casiii", "Pero como si tuvieras ganas"];
const FALLA_LARGA = ["A donde intentas llegar?", "No pero yo tampoco puedo saltar", "Apuntele bien"];
function g4(){
  const z=shell("Ven directo a mi","Haz jugado angry birds? Pues haz que el angry bird caiga en el cerdito.");
  z.style.flexDirection="column"; z.style.padding="8px";
  z.innerHTML='<canvas class="sling" id="sling" aria-label="Catapulta"></canvas><p class="note small" id="msg">Arrastra hacia atrás y suelta 🎯</p>';
  const cv=document.getElementById("sling"), g=cv.getContext("2d"), msg=document.getElementById("msg");
  const W=cv.clientWidth, H=280, GROUND=H-22, GRAV=.35, K=.16, MAXPULL=95;
  cv.width=W*devicePixelRatio; cv.height=H*devicePixelRatio; g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const SX=70, REST={x:SX, y:GROUND-78};
  const FX=Math.round(W*(.7+Math.random()*.2)), CATCH={x:FX-16, y:GROUND-46};
  const INK="#5a1f3a", HAIR="#d6336c", WOOD="#8a5a3b", BAND="#ff5c93";
  let p={...REST}, v=null, ang=0, state="ready", drag=false, step=0, t=0;

  const local=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top} };
  cv.addEventListener("pointerdown",e=>{
    if(state!=="ready") return;
    drag=true; cv.setPointerCapture(e.pointerId); move(e);
  });
  cv.addEventListener("pointermove",e=>drag&&move(e));
  cv.addEventListener("pointerup",()=>{
    if(!drag) return; drag=false;
    const dx=REST.x-p.x, dy=REST.y-p.y;
    if(Math.hypot(dx,dy)<12){ p={...REST}; return }
    v={x:dx*K, y:dy*K}; state="fly"; sfx.blow(); msg.textContent="Vuela Vuelaaaa";
  });
  function move(e){
    const q=local(e); let dx=q.x-REST.x, dy=q.y-REST.y; const len=Math.hypot(dx,dy);
    if(len>MAXPULL){ dx*=MAXPULL/len; dy*=MAXPULL/len }
    p={x:REST.x+dx, y:Math.min(REST.y+dy, GROUND-16)}; // que no se hunda en el piso
    const s=Math.floor(Math.min(len,MAXPULL)/20); if(s>step) sfx.stretch(s); step=s;
  }
  function reset(){ p={...REST}; v=null; ang=0; step=0; state="ready" }
  function miss(){
    state="miss"; sfx.bad();
    const list=p.x<FX-16 ? FALLA_CORTA : FALLA_LARGA; msg.textContent=list[Math.random()*list.length|0];
    setTimeout(()=>{ if(cv.isConnected){ reset(); } },1200);
  }
  function update(){
    if(state!=="fly") return;
    for(let i=0;i<3;i++){ // 3 pasitos por cuadro para no "atravesar" los brazos cuando va muy rápido
      v.y+=GRAV/3; p.x+=v.x/3; p.y+=v.y/3;
      if(Math.hypot(p.x-CATCH.x,p.y-CATCH.y)<28){
        state="caught"; p={x:FX-12, y:GROUND-36}; ang=0; sfx.right(); msg.textContent="Al fin, junticos <3";
        const r=cv.getBoundingClientRect(); burst(50, r.left+CATCH.x, r.top+CATCH.y);
        setTimeout(()=>cv.isConnected&&win(),1600); return;
      }
    }
    ang+=.18;
    if(p.y>GROUND-12){ p.y=GROUND-12; ang=Math.PI/2; miss() }
    else if(p.x>W+60 || p.x<-60) miss();
  }

  /* dibujos con palitos, como en el boceto. (x,y) es la cadera */
  function line(x1,y1,x2,y2){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke() }
  function head(x,y,r){ g.beginPath(); g.arc(x,y,r,0,7); g.fillStyle="#fff"; g.fill(); g.stroke();
    g.beginPath(); g.arc(x,y+1,r*.5,.2*Math.PI,.8*Math.PI); g.stroke();
    g.fillStyle=INK; g.fillRect(x-r*.4,y-r*.35,1.6,3); g.fillRect(x+r*.25,y-r*.35,1.6,3) }
  function paula(x,y,a,armsUp){
    g.save(); g.translate(x,y); g.rotate(a); g.strokeStyle=INK; g.lineWidth=2.5; g.lineCap="round";
    line(0,0,0,-24); line(0,0,-8,14); line(0,0,8,14);
    if(armsUp){ line(0,-18,-12,-30); line(0,-18,12,-30) } else { line(0,-18,-12,-8); line(0,-18,12,-8) }
    g.strokeStyle=HAIR; g.lineWidth=3;
    g.beginPath(); g.arc(0,-34,12,Math.PI*1.05,Math.PI*1.95); g.stroke();
    g.beginPath(); g.arc(-15,-34,6,-.5*Math.PI,1.3*Math.PI); g.stroke();
    g.beginPath(); g.arc(15,-34,6,-.3*Math.PI,1.5*Math.PI); g.stroke();
    g.strokeStyle=INK; g.lineWidth=2.5; head(0,-34,10);
    g.restore();
  }
  function felipe(){
    const x=FX, y=GROUND-26; g.strokeStyle=INK; g.lineWidth=2.5; g.lineCap="round";
    line(x,y,x,y-30); line(x,y,x-9,y+26); line(x,y,x+9,y+26);
    line(x,y-22,x-28,y-36); line(x,y-22,x-28,y-10); // brazos abiertos hacia ella
    head(x,y-42,11);
  }
  function label(text,x,y){ g.font='18px Caprasimo, Georgia, serif'; g.fillStyle=HAIR; g.textAlign="center"; g.fillText(text,x,y) }
  function draw(){
    t++; g.clearRect(0,0,W,H);
    g.strokeStyle="#f7b7cf"; g.lineWidth=3; line(0,GROUND,W,GROUND);
    if(state!=="caught"){ g.fillStyle=`rgba(255,92,147,${.12+.08*Math.sin(t/12)})`; g.beginPath(); g.arc(CATCH.x,CATCH.y,28,0,7); g.fill() }
    felipe(); label("Yo",FX,GROUND-92);
    g.strokeStyle=WOOD; g.lineWidth=7; g.lineCap="round";
    line(SX,GROUND,SX,GROUND-45); line(SX,GROUND-45,SX-16,GROUND-82);
    const loaded=state==="ready";
    g.strokeStyle=BAND; g.lineWidth=3;
    if(loaded){ line(SX-16,GROUND-82,p.x,p.y) } else line(SX-16,GROUND-82,SX+16,GROUND-82);
    if(state==="caught"){ paula(p.x,p.y,-.5,true); label("💞",FX-6,GROUND-100) }
    else paula(p.x,p.y,ang,state==="fly");
    if(loaded) { g.strokeStyle=BAND; g.lineWidth=3; line(p.x,p.y,SX+16,GROUND-82) }
    g.strokeStyle=WOOD; g.lineWidth=7; line(SX,GROUND-45,SX+16,GROUND-82);
    if(loaded && !drag) label("Tú",SX,GROUND-128);
    if(drag){ // pedacito de la trayectoria, en puntitos como el boceto
      let q={...p}, s={x:(REST.x-p.x)*K, y:(REST.y-p.y)*K}; g.fillStyle=INK;
      for(let i=1;i<=36;i++){ s.y+=GRAV; q.x+=s.x; q.y+=s.y; if(i%3===0){ g.globalAlpha=1-i/40; g.fillRect(q.x-2,q.y-1,4,2) } }
      g.globalAlpha=1;
    }
  }
  (function loop(){ if(!cv.isConnected) return; update(); draw(); requestAnimationFrame(loop) })();
}
/* 5 · arma tu nombre tocando las letras del título de arriba */
let undoTitle=null;
function g5(){
  const z=shell("Arma tu nombre","Busca las letras en el título de arriba y tócalas en orden para escribir tu nombre ☝️");
  const ans=document.createElement("div"); ans.className="answer";
  NAME.forEach(()=>ans.appendChild(document.createElement("span")));
  z.appendChild(ans);
  const h1=document.querySelector("header h1"), original=h1.innerHTML;
  let i=0; // cada palabra en un span que no se parte, cada letra en su propio span
  h1.innerHTML=h1.textContent.split(/(\s+)/).map(w=>/\s/.test(w)?w:
    `<span class="word">${[...w].map(c=>/\p{L}/u.test(c)?`<span class="ltr" style="--i:${i++}">${c}</span>`:c).join("")}</span>`).join("");
  h1.classList.add("hunt");
  undoTitle=()=>{ h1.innerHTML=original; h1.classList.remove("hunt"); undoTitle=null };
  let pos=0;
  h1.querySelectorAll(".ltr").forEach(s=>s.onclick=()=>{
    if(s.classList.contains("got") || pos===5) return;
    if(s.textContent.toLowerCase()===NAME[pos].toLowerCase()){
      s.classList.add("got"); ans.children[pos].textContent=NAME[pos]; sfx.pop(pos);
      const r=s.getBoundingClientRect(); burst(10, r.left+r.width/2, r.top+r.height/2);
      if(++pos===5) setTimeout(win,600);
    } else { sfx.bad(); s.animate([{transform:"translateX(-5px)"},{transform:"translateX(5px)"},{transform:"none"}],{duration:300}) }
  });
}
const games=[g1,g2,g3,g4,g5];

function finale(){
  burst(160); sfx.birthday();
  card.classList.add("final");
  card.innerHTML=`<div class="step">Llegaste al final del camino</div>
    <h2>¡Feliz cumpleaños, mi amor!</h2>

    <p class="sign">Con amor, Felipe</p>
    <div><button class="btn" id="again">Más confeti 🎉</button></div>`;

function intro(){
  card.innerHTML=`<div class="step">Un pequeño regalo adicional</div>
    <h2>Presta atención a los mensajes</h2>
    <p>Vas a estar pasando por diferentes pruebas muy sencillas, en cada una podrás ver desplegados mensajitos para que los puedas leer, espero que te guste.</p>
    <div class="zone" style="font-size:3.4rem">🎁</div>
    <div><button class="btn" id="go">Empezar el camino</button></div>`;

/* sonidos: hechos con Web Audio, sin archivos. El navegador solo deja sonar después del primer toque */
let ac=null, muted=false;
try{ muted=localStorage.getItem("mute")==="1" }catch(e){}
function audio(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); return ac }
function tone(f, at=0, d=.15, type="sine", vol=.2, f2){
  if(muted) return;
  const a=audio(), o=a.createOscillator(), g=a.createGain(), s=a.currentTime+at;
  o.type=type; o.frequency.setValueAtTime(f,s); if(f2) o.frequency.exponentialRampToValueAtTime(f2,s+d);
  g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(vol,s+.01); g.gain.exponentialRampToValueAtTime(.0001,s+d);
  o.connect(g).connect(a.destination); o.start(s); o.stop(s+d+.02);
}
const sfx={
  tick:()=>tone(880,0,.06,"triangle",.12),
  pop:k=>tone(520+k*90,0,.14,"sine",.25,(520+k*90)*2),
  heart:k=>tone(950-k*25,0,.18,"sine",.28,(950-k*25)*1.8),
  bad:()=>tone(240,0,.2,"triangle",.18,150),
  right:()=>[659,988].forEach((f,i)=>tone(f,i*.1,.25,"triangle",.18)),
  stretch:k=>tone(200+k*70,0,.06,"triangle",.1),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.3,"triangle",.18)),
  crackle(){
    if(muted) return;
    const a=audio(), n=a.sampleRate*.03, b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
    const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
    s.buffer=b; f.type="highpass"; f.frequency.value=1500+Math.random()*2500; g.gain.value=.25+Math.random()*.3;
    s.connect(f).connect(g).connect(a.destination); s.start();
  },
  blow(){
    if(muted) return;
    const a=audio(), n=a.sampleRate*.5, b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
    s.buffer=b; f.type="bandpass"; f.frequency.setValueAtTime(1800,a.currentTime); f.frequency.exponentialRampToValueAtTime(400,a.currentTime+.5); g.gain.value=.4;
    s.connect(f).connect(g).connect(a.destination); s.start();
  },
  /* "Cumpleaños feliz": [nota, tiempos] */
  birthday(){
    const N={G:392,A:440,B:494,C:523,D:587,E:659,F:698,g:784};
    const song=[["G",.75],["G",.25],["A",1],["G",1],["C",1],["B",2],
                ["G",.75],["G",.25],["A",1],["G",1],["D",1],["C",2],
                ["G",.75],["G",.25],["g",1],["E",1],["C",1],["B",1],["A",2],
                ["F",.75],["F",.25],["E",1],["C",1],["D",1],["C",3]];
    let t=.6; song.forEach(([n,b])=>{ tone(N[n],t,b*.36,"triangle",.16); t+=b*.38 });
  }
};
const muteBtn=document.getElementById("mute");
function paintMute(){ muteBtn.textContent=muted?"🔇":"🔊"; muteBtn.setAttribute("aria-label",muted?"Activar sonidos":"Silenciar sonidos") }
muteBtn.onclick=()=>{ muted=!muted; try{ localStorage.setItem("mute",muted?"1":"0") }catch(e){} paintMute(); sfx.tick() };
paintMute();

/* confeti */
const cv=document.getElementById("fx"), cx=cv.getContext("2d"); let parts=[], raf=null;
function size(){cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener("resize",size); size();
function burst(n, x=innerWidth/2, y=innerHeight*.45){
  const cols=["#ff5c93","#ffb3cc","#d6336c","#ffd166","#ffffff"];
  for(let i=0;i<n;i++) parts.push({x:x+(Math.random()-.5)*120,y,vx:(Math.random()-.5)*12,vy:-Math.random()*13-3,
    s:4+Math.random()*6,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.3,heart:Math.random()<.3,life:0});
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+30&&p.life<260);
  parts.forEach(p=>{
    p.vy+=.32; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
    if(p.heart){cx.font=(p.s*2.4)+"px serif"; cx.fillText("♥",0,0)} else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    cx.restore();
  });
  raf = parts.length ? requestAnimationFrame(tick) : null;
}

/* fuego: llamas que suben desde abajo, detrás de la tarjeta. heat va de 0 (nada) a 1 (todo en llamas) */
const fc=document.getElementById("fire"), fcx=fc.getContext("2d"), scorch=document.getElementById("scorch");
let heat=0, flames=[], fireRaf=null;
function fireSize(){fc.width=innerWidth*devicePixelRatio; fc.height=innerHeight*devicePixelRatio; fcx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener("resize",fireSize); fireSize();
function setHeat(h){ heat=h; scorch.style.opacity=h; if(!fireRaf) fireRaf=requestAnimationFrame(fireTick) }
function fireTick(){
  fcx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=0;i<Math.round(heat*9);i++) flames.push({x:Math.random()*innerWidth, y:innerHeight+30, r:30+Math.random()*50*(.4+heat),
    vy:(2+Math.random()*3)*(.5+heat), life:0, max:30+Math.random()*80*heat});
  flames=flames.filter(f=>f.life<f.max);
  flames.forEach(f=>{
    f.life++; f.y-=f.vy; f.x+=Math.sin((f.life+f.r)*.15)*1.5;
    const t=f.life/f.max, r=f.r*(1-t*.75), a=.9*(1-t), g=fcx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
    g.addColorStop(0,`rgba(255,${235-t*120|0},120,${a})`);
    g.addColorStop(.45,`rgba(255,${130-t*90|0},20,${a*.85})`);
    g.addColorStop(1,"rgba(200,30,0,0)");
    fcx.fillStyle=g; fcx.beginPath(); fcx.arc(f.x,f.y,r,0,7); fcx.fill();
  });
  fireRaf = (heat>0 || flames.length) ? requestAnimationFrame(fireTick) : null;
}

paint(); intro();
